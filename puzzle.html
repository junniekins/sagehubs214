<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Your Gift 🧩</title>
  <style>
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: #0f0f14; color:#f3f3f7; padding:18px;
    }
    .wrap{ width:min(980px,100%); display:grid; gap:12px; }
    .top{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    a{ color:#ff9ac3; text-decoration:none; font-weight:650; }
    .frame{
      width:100%;
      aspect-ratio: 16/10;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.05);
    }
    iframe{ width:100%; height:100%; border:0; }
    .note{ color:rgba(255,255,255,.7); font-size:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div style="font-size:18px;font-weight:750;">Okay… ready? 🧩</div>
        <div class="note">Finish it for the full message.</div>
      </div>
      <a href="index.html">← back to letter</a>
    </div>

    <div class="frame">
      <!-- PASTE YOUR JIGSAWPLANET IFRAME HERE (from Share → Embed) -->
      <iframe src="PASTE_YOUR_IFRAME_SRC_HERE" allowfullscreen></iframe>
    </div>
  </div>
</body>
</html>
